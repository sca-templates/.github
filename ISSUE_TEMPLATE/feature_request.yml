name: Feature request
description: Propose a new feature or improvement
title: "feat: <short description>"
labels: ["enhancement"]
body:
  - type: input
    id: repository
    attributes:
      label: Repository
      description: Which repository is this for (or "organization-wide")?
      placeholder: "e.g. CI-CD-Templates"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Is it related to a frustration?
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed behavior
      description: How should things behave after this change?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know this is complete?
    validations:
      required: false
